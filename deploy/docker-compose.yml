# Bull AI Voice Calling Platform.
# Run from the repository root:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# --env-file .env is required: it supplies the passwords and BASE_PATH, which the frontend is built with.
#
# Only the app is published to the host (port 8084). PostgreSQL and Redis stay on the internal network.
# Uploaded files (and call recordings from Phase 3) are kept, encrypted, in the "storage" volume.
# Celery workers are added in Phase 4.

name: bullcall

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: [*restart, *logging]
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 2g }

  redis:
    <<: [*restart, *logging]
    image: redis:8.2.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 512m }

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: bullcall-backend:latest
    env_file: ../.env
    environment: &app-env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ROOT: /srv/var/storage
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    <<: [*restart, *logging]
    image: bullcall-backend:latest
    env_file: ../.env
    environment:
      <<: *app-env
      # The host nginx reaches the app through Docker's port forwarding, so requests arrive from the Docker
      # gateway, not 127.0.0.1. Trust its X-Forwarded-For/-Proto so audit logs record the real client IP.
      # Safe while APP_BIND_ADDRESS is 127.0.0.1 (only processes on this server can connect).
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8084:8083"
    volumes:
      - storage:/srv/var/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; b=os.environ.get('BASE_PATH','').strip('/'); u='http://127.0.0.1:8083'+('/'+b if b else '')+'/api/v1/health/ready'; sys.exit(0 if urllib.request.urlopen(u, timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Time to finish saving a call that is ending before the container is killed.
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 2g }

volumes:
  pgdata:
  redisdata:
  storage:
